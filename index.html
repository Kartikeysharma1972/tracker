<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentum · Discipline & Gym Studio</title>
<meta name="description" content="Offline-first discipline tracker with a full gym studio: members, attendance, workout logging, progress analytics and diet plan generation.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07080a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Momentum">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/views.css">
</head>
<body>

<!-- ============ PIN LOCK ============ -->
<div class="overlay" id="lockOverlay">
  <div class="glass modal narrow" style="text-align:center">
    <div style="width:46px;height:46px;border-radius:14px;margin:0 auto 12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14v11H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h3>Enter PIN</h3>
    <p style="color:var(--muted);font-size:12.5px;margin-top:4px">Momentum is locked on this device</p>
    <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <div class="keypad" id="keypad">
      <div class="k" data-k="1">1</div><div class="k" data-k="2">2</div><div class="k" data-k="3">3</div>
      <div class="k" data-k="4">4</div><div class="k" data-k="5">5</div><div class="k" data-k="6">6</div>
      <div class="k" data-k="7">7</div><div class="k" data-k="8">8</div><div class="k" data-k="9">9</div>
      <div class="k" style="opacity:.35;pointer-events:none"></div><div class="k" data-k="0">0</div><div class="k" data-k="del">⌫</div>
    </div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div class="shell">
  <aside class="nav" id="nav">
    <div class="nav-brand">
      <div class="mark">
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
      </div>
      <div class="txt"><b>Momentum</b><span>Discipline · Gym Studio</span></div>
    </div>
    <div class="nav-scroll" id="navScroll"></div>
    <div class="nav-foot" id="navFoot"></div>
  </aside>
  <div class="scrim" id="navScrim"></div>

  <main class="main">
    <header class="top" id="top"></header>
    <div class="page">
      <div class="kpis" id="kpiStrip"></div>
      <div id="view"></div>
    </div>
  </main>
</div>

<!-- ============ HOSTS ============ -->
<div class="overlay" id="modalHost"></div>
<div class="scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawerHost"></aside>
<div class="glass toast" id="toast"></div>
<a class="dl-anchor" id="dlAnchor"></a>

<!-- ============ INSTALL BANNER ============ -->
<div class="glass no-print" id="installBar" style="display:none;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:85;padding:11px 14px;max-width:94vw">
  <div style="display:flex;align-items:center;gap:12px">
    <img src="icon-192.png" alt="" style="width:32px;height:32px;border-radius:9px">
    <div style="font-size:12.5px;line-height:1.45">
      <b>Install Momentum as an app</b><br><span id="installHow" style="color:var(--muted)"></span>
    </div>
    <button id="installBtn" class="btn primary">Install</button>
    <button id="installClose" class="icb bare" aria-label="Dismiss">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>

<!-- ============ SCRIPTS (order matters) ============ -->
<script src="assets/js/core.js"></script>
<script src="assets/js/data.exercises.js"></script>
<script src="assets/js/data.foods.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/nutrition.js"></script>
<script src="assets/js/programs.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/habits.js"></script>
<script src="assets/js/gym.js"></script>
<script src="assets/js/gym-log.js"></script>
<script src="assets/js/diet.js"></script>
<script src="assets/js/report.js"></script>
<script src="assets/js/app.js"></script>

<!-- PWA: service worker + install prompt -->
<script>
(function(){
  "use strict";
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
  var bar = document.getElementById("installBar"), how = document.getElementById("installHow"),
      btn = document.getElementById("installBtn"), close = document.getElementById("installClose");
  var deferred = null, dismissed = false;
  try { dismissed = localStorage.getItem("mm_install_dismiss") === "1"; } catch (e) {}
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  function show(mode) {
    if (dismissed || standalone) return;
    if (mode === "ios") { how.textContent = "In Safari: Share → Add to Home Screen"; btn.style.display = "none"; }
    else { how.textContent = "One tap and it lives on your home screen"; btn.style.display = ""; }
    bar.style.display = "block";
  }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; show("prompt"); });
  if (isIOS && !standalone && !dismissed) setTimeout(function () { show("ios"); }, 1800);
  window.addEventListener("appinstalled", function () { bar.style.display = "none"; });
  btn.onclick = function () { if (deferred) { deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; bar.style.display = "none"; }); } };
  close.onclick = function () { bar.style.display = "none"; dismissed = true; try { localStorage.setItem("mm_install_dismiss", "1"); } catch (e) {} };
})();
</script>
</body>
</html>
